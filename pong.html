<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Pong</title>

<style>
*{box-sizing:border-box}

:root{
    --cyan:#4de1ff;
    --pink:#ff5c8a;
    --green:#20c982;
    --dark:#07131d;
}

body{
    margin:0;
    min-height:100vh;
    padding:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-family:Arial,sans-serif;
    background:radial-gradient(circle at top,#243b55,#101820 70%);
}

.game-wrapper{
    width:min(860px,100%);
    text-align:center;
}

h1{
    margin:0 0 5px;
    font-size:clamp(1.35rem,3vw,2.2rem);
    line-height:1;
    letter-spacing:4px;
    text-shadow:0 0 12px rgba(77,225,255,.6);
}

.top-panel{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:6px;
}

label{
    color:#dceef5;
    font-size:.78rem;
    font-weight:bold;
}

button,select,input{
    border:0;
    border-radius:7px;
    padding:7px 9px;
    font:inherit;
    font-size:.76rem;
}

button{
    color:#fff;
    cursor:pointer;
    transition:.2s;
    white-space:nowrap;
}

button:hover{
    transform:translateY(-1px);
    filter:brightness(1.15);
}

.select-wrapper{
    position:relative;
    display:inline-flex;
}

.select-wrapper:after{
    content:"⌄";
    position:absolute;
    right:8px;
    top:3px;
    color:var(--cyan);
    pointer-events:none;
}

select{
    min-width:108px;
    appearance:none;
    padding-right:26px;
    color:#fff;
    outline:0;
    cursor:pointer;
    background:linear-gradient(135deg,#17445a,#3c203d);
    border:1px solid rgba(77,225,255,.65);
}

select option{
    color:#fff;
    background:#102331;
}

.start{background:var(--green)}
.pause{background:#f39c12}
.restart,.end{background:#e74c3c}
.settings{background:#704dcc}

.scoreboard{
    display:flex;
    justify-content:space-around;
    align-items:center;
    max-width:820px;
    margin:0 auto 6px;
    font-size:clamp(.8rem,2vw,1.15rem);
    font-weight:bold;
}

.score{min-width:100px}
.player-label{color:var(--cyan)}
.bot-label{color:var(--pink)}

.score span{
    display:block;
    margin-top:1px;
    font-size:1.75em;
    color:#fff;
}

.versus{
    color:#aab8c0;
    font-size:.62rem;
    white-space:nowrap;
}

canvas{
    display:block;
    width:100%;
    max-width:860px;
    height:auto;
    margin:auto;
    cursor:crosshair;
    touch-action:none;
    border:3px solid var(--cyan);
    border-radius:8px;
    background:var(--dark);
    box-shadow:0 0 25px rgba(77,225,255,.25);
}

.message{
    min-height:23px;
    margin-top:6px;
    color:#ffd166;
    font-size:.86rem;
    font-weight:bold;
}

.instructions{
    margin-top:3px;
    color:#b8c7d1;
    font-size:.7rem;
}

.modal{
    position:fixed;
    inset:0;
    z-index:10;
    display:none;
    justify-content:center;
    align-items:center;
    padding:12px;
    background:rgba(0,0,0,.75);
}

.modal.open{display:flex}

.modal-card{
    width:min(500px,100%);
    max-height:90vh;
    overflow-y:auto;
    padding:20px;
    text-align:left;
    border:1px solid var(--cyan);
    border-radius:14px;
    background:#102331;
    box-shadow:0 0 30px rgba(77,225,255,.3);
}

.modal-card h2{
    margin:0 0 16px;
    color:var(--cyan);
    text-align:center;
    font-size:1.4rem;
}

.modal-card h3{margin-bottom:7px}

.modal-card input{
    width:100%;
    margin:7px 0 12px;
    color:#fff;
    outline:0;
    background:#07131d;
    border:1px solid #426273;
}

.modal-actions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:16px;
}

.back-button{
    width:100%;
    margin-top:4px;
    color:#fff;
    background:#334b5a;
    border:1px solid #607b8b;
}

.back-button:hover{background:#456577}

.history{
    max-height:210px;
    overflow-y:auto;
}

.history-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px;
    margin:6px 0;
    border-radius:7px;
    background:#07131d;
    font-size:.78rem;
}

.win{color:#55e69b}
.loss{color:#ff789c}
.empty-history{color:#9aabb4}

@media(max-width:600px){
    body{padding:5px}
    .top-panel{gap:3px}
    button,select{padding:6px 7px;font-size:.68rem}
    .score{min-width:80px}
    .versus{font-size:.55rem}
    .instructions{font-size:.65rem}
}
</style>
</head>

<body>
<main class="game-wrapper">
    <h1>PONG</h1>

    <div class="top-panel">
        <label for="botLevel">Bot:</label>

        <div class="select-wrapper">
            <select id="botLevel">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
                <option value="impossible">Impossible</option>
            </select>
        </div>

        <button id="startButton" class="start">Start</button>
        <button id="pauseButton" class="pause">Pause</button>
        <button id="endButton" class="end">End</button>
        <button id="restartButton" class="restart">Restart</button>
        <button id="settingsButton" class="settings">Settings</button>
    </div>

    <div class="scoreboard">
        <div class="score player-label">
            <span id="playerNameLabel">PLAYER</span>
            <span id="playerScore">0</span>
        </div>

        <div class="versus">FIRST TO 7</div>

        <div class="score bot-label">
            BOT
            <span id="botScore">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="900" height="520"></canvas>

    <div id="message" class="message">Press “Start” to begin</div>

    <div class="instructions">
        Move with your mouse, W/S, or ↑/↓. Press Space to pause.
    </div>
</main>

<section id="settingsModal" class="modal">
    <div class="modal-card">
        <h2>Settings</h2>

        <label for="nameInput">Your name</label>
        <input id="nameInput" maxlength="20" placeholder="Enter your name">

        <div class="modal-actions">
            <button id="saveNameButton" class="start">Save Name</button>
            <button id="clearHistoryButton" class="end">Clear History</button>
        </div>

        <h3>Records</h3>
        <div id="records"></div>

        <h3>Game History</h3>
        <div id="history" class="history"></div>

        <button id="closeSettingsButton" class="back-button" type="button">
            ← Back to Game
        </button>
    </div>
</section>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const playerScoreElement=document.getElementById("playerScore");
const botScoreElement=document.getElementById("botScore");
const playerNameLabel=document.getElementById("playerNameLabel");
const botLevelSelect=document.getElementById("botLevel");
const startButton=document.getElementById("startButton");
const pauseButton=document.getElementById("pauseButton");
const endButton=document.getElementById("endButton");
const restartButton=document.getElementById("restartButton");
const settingsButton=document.getElementById("settingsButton");
const messageElement=document.getElementById("message");

const settingsModal=document.getElementById("settingsModal");
const nameInput=document.getElementById("nameInput");
const saveNameButton=document.getElementById("saveNameButton");
const closeSettingsButton=document.getElementById("closeSettingsButton");
const clearHistoryButton=document.getElementById("clearHistoryButton");
const recordsElement=document.getElementById("records");
const historyElement=document.getElementById("history");

const W=canvas.width;
const H=canvas.height;
const WINNING_SCORE=7;

const paddle={width:15,height:100,speed:8};

const player={
    x:28,
    y:H/2-paddle.height/2,
    score:0
};

const bot={
    x:W-43,
    y:H/2-paddle.height/2,
    score:0
};

const ball={
    x:W/2,
    y:H/2,
    radius:10,
    speed:6,
    velocityX:6,
    velocityY:4
};

const keys={up:false,down:false};

const botSettings={
    easy:{speed:3.5,reaction:.075},
    medium:{speed:5,reaction:.11},
    hard:{speed:6.5,reaction:.16},
    impossible:{speed:9,reaction:.3}
};

let gameStarted=false;
let gamePaused=false;
let gameOver=false;
let gameEnded=false;
let gameRecorded=false;
let animationId;

let playerName=localStorage.getItem("pongPlayerName")||"PLAYER";
let gameHistory=JSON.parse(
    localStorage.getItem("pongGameHistory")||"[]"
);

playerNameLabel.textContent=playerName.toUpperCase();
nameInput.value=playerName;

function drawRoundedRect(x,y,w,h,r,color){
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
    ctx.fillStyle=color;
    ctx.fill();
}

function drawCourt(){
    ctx.fillStyle="#07131d";
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle="rgba(77,225,255,.35)";
    ctx.lineWidth=3;
    ctx.setLineDash([12,14]);

    ctx.beginPath();
    ctx.moveTo(W/2,0);
    ctx.lineTo(W/2,H);
    ctx.stroke();

    ctx.setLineDash([]);

    drawRoundedRect(
        player.x,player.y,paddle.width,paddle.height,7,"#4de1ff"
    );

    drawRoundedRect(
        bot.x,bot.y,paddle.width,paddle.height,7,"#ff5c8a"
    );

    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
    ctx.fillStyle="#fff";
    ctx.shadowColor="#fff";
    ctx.shadowBlur=15;
    ctx.fill();
    ctx.shadowBlur=0;
}

function resetBall(direction=1){
    ball.x=W/2;
    ball.y=H/2;

    const angle=Math.random()*Math.PI/3-Math.PI/6;

    ball.speed=6;
    ball.velocityX=Math.cos(angle)*ball.speed*direction;
    ball.velocityY=Math.sin(angle)*ball.speed;

    player.y=H/2-paddle.height/2;
    bot.y=H/2-paddle.height/2;
}

function resetGame(){
    cancelAnimationFrame(animationId);

    player.score=0;
    bot.score=0;
    playerScoreElement.textContent="0";
    botScoreElement.textContent="0";

    gameStarted=false;
    gamePaused=false;
    gameOver=false;
    gameEnded=false;
    gameRecorded=false;

    startButton.textContent="Start";
    pauseButton.textContent="Pause";
    messageElement.textContent="Press “Start” to begin";

    resetBall(Math.random()>.5?1:-1);
    gameLoop();
}

function startGame(){
    if(gameOver||gameEnded) resetGame();

    gameStarted=true;
    gamePaused=false;
    gameOver=false;
    gameEnded=false;

    startButton.textContent="Playing...";
    pauseButton.textContent="Pause";
    messageElement.textContent="";
}

function endGame(){
    if(!gameStarted||gameOver||gameEnded)return;

    gameStarted=false;
    gameEnded=true;
    recordGame("ended");

    messageElement.textContent=
        `Game ended. Final score: ${player.score} - ${bot.score}.`;

    startButton.textContent="Start Again";
}

function togglePause(){
    if(!gameStarted||gameOver||gameEnded){
        messageElement.textContent="Press “Start” to begin";
        return;
    }

    gamePaused=!gamePaused;
    pauseButton.textContent=gamePaused?"Resume":"Pause";
    messageElement.textContent=gamePaused?"Game paused":"";
}

function movePlayer(){
    if(keys.up)player.y-=paddle.speed;
    if(keys.down)player.y+=paddle.speed;

    player.y=Math.max(0,Math.min(H-paddle.height,player.y));
}

function movePlayerWithCursor(event){
    const rect=canvas.getBoundingClientRect();
    const cursorY=event.clientY-rect.top;
    const scaleY=H/rect.height;

    player.y=cursorY*scaleY-paddle.height/2;
    player.y=Math.max(0,Math.min(H-paddle.height,player.y));
}

function moveBot(){
    const setting=botSettings[botLevelSelect.value];
    const center=bot.y+paddle.height/2;
    const target=ball.y;

    if(center<target-10){
        bot.y+=Math.min(
            setting.speed,
            (target-center)*setting.reaction
        );
    }else if(center>target+10){
        bot.y-=Math.min(
            setting.speed,
            (center-target)*setting.reaction
        );
    }

    bot.y=Math.max(0,Math.min(H-paddle.height,bot.y));
}

function touchesPaddle(object){
    return(
        ball.x-ball.radius<object.x+paddle.width&&
        ball.x+ball.radius>object.x&&
        ball.y-ball.radius<object.y+paddle.height&&
        ball.y+ball.radius>object.y
    );
}

function bounceFromPaddle(object,direction){
    const center=object.y+paddle.height/2;
    const hit=(ball.y-center)/(paddle.height/2);
    const angle=hit*Math.PI/3;

    ball.speed=Math.min(ball.speed+.35,14);
    ball.velocityX=Math.cos(angle)*ball.speed*direction;
    ball.velocityY=Math.sin(angle)*ball.speed;
}

function recordGame(type){
    if(gameRecorded)return;

    gameRecorded=true;

    const result=type==="ended"
        ?"Ended"
        :(player.score>bot.score?"Won":"Lost");

    gameHistory.unshift({
        date:new Date().toLocaleString(),
        result,
        playerScore:player.score,
        botScore:bot.score,
        level:botLevelSelect.value
    });

    gameHistory=gameHistory.slice(0,50);

    localStorage.setItem(
        "pongGameHistory",
        JSON.stringify(gameHistory)
    );

    updateSettingsView();
}

function scorePoint(playerScored){
    if(playerScored){
        player.score++;
        playerScoreElement.textContent=player.score;
    }else{
        bot.score++;
        botScoreElement.textContent=bot.score;
    }

    if(player.score>=WINNING_SCORE||bot.score>=WINNING_SCORE){
        gameOver=true;
        gameStarted=false;

        const won=player.score>=WINNING_SCORE;
        recordGame("finished");

        messageElement.textContent=won
            ?`Congratulations ${playerName}, you won!`
            :"The bot won this game.";

        startButton.textContent="Start Again";
        return;
    }

    resetBall(playerScored?-1:1);
}

function update(){
    if(!gameStarted||gamePaused||gameOver||gameEnded)return;

    movePlayer();
    moveBot();

    ball.x+=ball.velocityX;
    ball.y+=ball.velocityY;

    if(ball.y-ball.radius<=0||ball.y+ball.radius>=H){
        ball.velocityY*=-1;
        ball.y=Math.max(
            ball.radius,
            Math.min(H-ball.radius,ball.y)
        );
    }

    if(ball.velocityX<0&&touchesPaddle(player)){
        ball.x=player.x+paddle.width+ball.radius;
        bounceFromPaddle(player,1);
    }

    if(ball.velocityX>0&&touchesPaddle(bot)){
        ball.x=bot.x-ball.radius;
        bounceFromPaddle(bot,-1);
    }

    if(ball.x<-ball.radius)scorePoint(false);
    if(ball.x>W+ball.radius)scorePoint(true);
}

function gameLoop(){
    update();
    drawCourt();
    animationId=requestAnimationFrame(gameLoop);
}

function updateSettingsView(){
    const wins=gameHistory.filter(x=>x.result==="Won").length;
    const losses=gameHistory.filter(x=>x.result==="Lost").length;
    const ended=gameHistory.filter(x=>x.result==="Ended").length;

    recordsElement.innerHTML=`
        <p>Games played: <b>${gameHistory.length}</b></p>
        <p class="win">Wins: <b>${wins}</b></p>
        <p class="loss">Losses: <b>${losses}</b></p>
        <p>Ended games: <b>${ended}</b></p>
    `;

    if(!gameHistory.length){
        historyElement.innerHTML=
            `<p class="empty-history">No games played yet.</p>`;
        return;
    }

    historyElement.innerHTML=gameHistory.map(game=>`
        <div class="history-item">
            <span>
                <b class="${game.result==="Won"?"win":"loss"}">
                    ${game.result}
                </b>
                <br>${game.date}
            </span>
            <span>
                ${game.playerScore} - ${game.botScore}<br>
                ${game.level}
            </span>
        </div>
    `).join("");
}

function closeSettings(){
    settingsModal.classList.remove("open");
    document.body.style.overflow="auto";
}

canvas.addEventListener("mousemove",movePlayerWithCursor);
canvas.addEventListener("pointermove",movePlayerWithCursor);

startButton.addEventListener("click",startGame);
pauseButton.addEventListener("click",togglePause);
endButton.addEventListener("click",endGame);
restartButton.addEventListener("click",resetGame);

settingsButton.addEventListener("click",()=>{
    nameInput.value=playerName;
    updateSettingsView();
    settingsModal.classList.add("open");
    document.body.style.overflow="hidden";
});

closeSettingsButton.addEventListener("click",closeSettings);

settingsModal.addEventListener("click",event=>{
    if(event.target===settingsModal)closeSettings();
});

saveNameButton.addEventListener("click",()=>{
    const newName=nameInput.value.trim();

    if(newName){
        playerName=newName;
        localStorage.setItem("pongPlayerName",playerName);
        playerNameLabel.textContent=playerName.toUpperCase();
        messageElement.textContent=`Name saved: ${playerName}`;
    }
});

clearHistoryButton.addEventListener("click",()=>{
    if(confirm("Delete all game history?")){
        gameHistory=[];
        localStorage.removeItem("pongGameHistory");
        updateSettingsView();
    }
});

botLevelSelect.addEventListener("change",()=>{
    if(!gameOver&&!gameEnded){
        messageElement.textContent=
            `Bot difficulty changed to ${botLevelSelect.value}.`;
    }
});

document.addEventListener("keydown",event=>{
    if(event.key==="w"||event.key==="W"||event.key==="ArrowUp"){
        keys.up=true;
        event.preventDefault();
    }

    if(event.key==="s"||event.key==="S"||event.key==="ArrowDown"){
        keys.down=true;
        event.preventDefault();
    }

    if(event.code==="Space"){
        togglePause();
        event.preventDefault();
    }

    if(event.key==="Escape")closeSettings();
});

document.addEventListener("keyup",event=>{
    if(event.key==="w"||event.key==="W"||event.key==="ArrowUp"){
        keys.up=false;
    }

    if(event.key==="s"||event.key==="S"||event.key==="ArrowDown"){
        keys.down=false;
    }
});

updateSettingsView();
resetGame();
</script>
</body>
</html>
